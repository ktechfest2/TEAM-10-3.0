name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tally:tally@localhost:5432/tally
      PHONE_PEPPER: ci-only-pepper
      ANCHOR_CRON_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build (migrates and seeds the database)
        run: pnpm build
      - name: End-to-end result journey
        run: |
          pnpm start --port 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/verify >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3100 pnpm check:journey
      - name: Simulation and mission control
        run: BASE_URL=http://localhost:3100 pnpm check:sim
